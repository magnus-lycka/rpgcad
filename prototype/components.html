<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RPGCAD · Component catalogue</title>
  <style>
    body {
      margin: 2rem auto;
      padding: 0 1.5rem;
      max-width: 90rem;
      background: #f1f5fa;
      color: #27332e;
      font-family: system-ui, sans-serif;
    }
    h1 {
      margin-bottom: 0.4rem;
    }
    a {
      color: #244c63;
    }
    input,
    button {
      font: inherit;
      padding: 0.6rem;
    }
    input {
      display: block;
      width: min(32rem, 95%);
      margin-top: 0.4rem;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 32rem), 1fr));
      gap: 1.25rem;
    }
    article {
      background: white;
      border: 1px solid #ccd4da;
      border-radius: 0.4rem;
      padding: 1.25rem;
      overflow-wrap: anywhere;
    }
    h2 {
      margin: 0 0 0.5rem;
      font-size: 1.25rem;
    }
    svg {
      width: 100%;
      height: 210px;
      background: white;
    }
    dl {
      margin: 0;
    }
    dt {
      font-weight: 600;
      margin-top: 0.75rem;
    }
    dd {
      margin: 0.2rem 0 0;
      line-height: 1.5;
    }
    summary {
      cursor: pointer;
      margin-top: 1rem;
    }
    #pagination {
      display: flex;
      gap: 1rem;
      margin: 1.5rem 0;
    }
    #pagination[hidden] {
      display: none;
    }
    .caption {
      font-size: 0.85rem;
      color: #55615b;
    }
    body[data-embedded] {
      margin: 0;
      padding: 8px;
      background: #f7fafb;
      font-size: 13px;
    }
    body[data-embedded] > nav:first-of-type,
    body[data-embedded] > h1,
    body[data-embedded] > p:not(#status) {
      display: none;
    }
    body[data-embedded] article {
      padding: 10px;
    }
    body[data-embedded] h2 {
      font-size: 15px;
    }
    body[data-embedded] article > p {
      margin: 4px 0;
      font-size: 12px;
    }
    body[data-embedded] svg {
      height: 130px;
    }
    body[data-embedded] #cards {
      gap: 8px;
      grid-template-columns: 1fr;
    }
    body[data-embedded] input {
      box-sizing: border-box;
      width: 100%;
    }
    /* Same dark language as the toolbar and its panels. */
    body {
      background: #1b1c1f;
      color: #d7d8db;
    }
    h1,
    h2 {
      color: #f3f4f6;
    }
    a {
      color: #8fc2ee;
    }
    article,
    fieldset {
      background: #26272b;
      border: 0;
      border-radius: 9px;
      color: #d7d8db;
    }
    legend,
    .caption,
    label {
      color: #9a9ba1;
    }
    input,
    textarea,
    select {
      box-sizing: border-box;
      padding: 5px 8px;
      color: #f3f4f6;
      background: #1b1c1f;
      border: 1px solid #45464c;
      border-radius: 5px;
    }
    input[type="checkbox"] {
      accent-color: #176ca4;
    }
    button {
      padding: 6px 10px;
      color: #d7d8db;
      background: #35363b;
      border: 0;
      border-radius: 5px;
    }
    button:hover:not(:disabled) {
      background: #45464c;
    }
    button:disabled {
      color: #6b6c72;
    }
    dialog {
      color: #d7d8db;
      background: #26272b;
      border: 0;
      border-radius: 9px;
    }
    dialog::backdrop {
      background: rgba(0, 0, 0, 0.4);
    }
    summary {
      color: #8fc2ee;
    }
    :focus-visible {
      outline: 2px solid #8fc2ee;
      outline-offset: 2px;
    }
    body[data-embedded] {
      background: #26272b;
    }
    body[data-embedded] article {
      background: #2f3035;
    }
  </style>
  <nav><a href="/library.html">Plan library</a></nav>
  <h1>Component catalogue</h1>
  <p>
    Original reusable drawings. Choose an identifier here, then describe its
    placement in chat with your saved drawing marks.
  </p>
  <label
    >Find components<input
      id="search"
      type="search"
      placeholder="Name, alias or tag"
  /></label>
  <p class="caption">
    Aliases name the same definition. Related types stay distinct; a similar
    name does not make them interchangeable.
  </p>
  <p id="status" role="status"></p>
  <section id="cards" aria-label="Components"></section>
  <nav id="pagination" aria-label="Catalogue pages" hidden>
    <button id="previous">Previous</button><button id="next">Next</button>
  </nav>
  <script type="module" src="/components.js"></script>
</html>
