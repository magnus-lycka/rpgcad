<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RPGCAD</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white}
#viewport{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
#viewport:active{cursor:grabbing}
#print-pages{display:none}
.page{margin:0;break-after:page;page-break-after:always;overflow:hidden}
.page:last-child{break-after:auto;page-break-after:auto}
.page svg{display:block}
@media print{html,body{height:auto;overflow:visible}#viewport{display:none}#print-pages{display:block}}
</style>
<style id="page-style">@page{size:A4 landscape;margin:0}</style>
<svg id="viewport" xmlns="http://www.w3.org/2000/svg" aria-label="Floor plan on a 1.5 metre square grid" role="img"></svg>
<div id="print-pages"></div>
<script>
// Portable pure model/geometry functions. No DOM or network dependencies.
const Geometry=(()=>{
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
 const length=w=>Math.hypot(w.b[0]-w.a[0],w.b[1]-w.a[1]);
 const finite=n=>typeof n==='number'&&Number.isFinite(n);
 function validate(m){
  const fail=s=>{throw Error(s)},positive=n=>finite(n)&&n>0,point=p=>Array.isArray(p)&&p.length===2&&p.every(finite);
  if(!m||!Array.isArray(m.walls)||!Array.isArray(m.openings)||!Array.isArray(m.labels)||!positive(m.wallThickness))fail('Expected walls, openings, labels and a positive wallThickness.');
  const ids=new Set();for(const o of [...m.walls,...m.openings,...m.labels]){if(!o||typeof o.id!=='string'||!o.id||ids.has(o.id))fail('Every object needs a unique id.');ids.add(o.id)}
  for(const w of m.walls)if(!point(w.a)||!point(w.b)||!positive(length(w))||!positive(w.thickness??m.wallThickness))fail(`Invalid wall ${w.id}`);
  for(const o of m.openings){const w=m.walls.find(w=>w.id===o.wall);if(!w||!finite(o.offset)||o.offset<0||!positive(o.width)||o.offset+o.width>length(w)+1e-8)fail(`Opening ${o.id} must fit its wall.`)}
  for(const l of m.labels)if(!point(l.at)||typeof l.text!=='string'||!positive(l.size??.4))fail(`Invalid label ${l.id}`);
  return m;
 }
 function wallPolygons(m,w){
  const len=length(w),t=(w.thickness??m.wallThickness)/2,ux=(w.b[0]-w.a[0])/len,uy=(w.b[1]-w.a[1])/len;
  // Merge overlapping openings before splitting wall geometry. Only original
  // wall endpoints extend by half thickness; opening edges have butt ends.
  const gaps=m.openings.filter(o=>o.wall===w.id).map(o=>[o.offset,o.offset+o.width]).sort((a,b)=>a[0]-b[0]);
  const merged=[];for(const gap of gaps){const last=merged.at(-1);if(last&&gap[0]<=last[1])last[1]=Math.max(last[1],gap[1]);else merged.push([...gap])}
  const spans=[];let cursor=0;for(const [a,b] of merged){if(a>cursor)spans.push([cursor,a]);cursor=b}if(cursor<len)spans.push([cursor,len]);
  return spans.map(([a,b])=>{if(a===0&&!merged.some(g=>g[0]===0))a-=t;if(b===len&&!merged.some(g=>g[1]===len))b+=t;return [[a,t],[b,t],[b,-t],[a,-t]].map(([d,n])=>[w.a[0]+ux*d-uy*n,w.a[1]+uy*d+ux*n])});
 }
 function bounds(m){
  const pts=m.walls.flatMap(w=>wallPolygons(m,w).flat());
  for(const l of m.labels){const s=l.size??.4,half=l.text.length*s*.34;pts.push([l.at[0]-half,l.at[1]-s],[l.at[0]+half,l.at[1]+s])}
  if(!pts.length)return {x:0,y:0,w:21,h:15};const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return {x:Math.min(...xs),y:Math.min(...ys),w:Math.max(...xs)-Math.min(...xs),h:Math.max(...ys)-Math.min(...ys)};
 }
 function scene(m,b,{id='grid',gridStroke=.018}={}){
  let s=`<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="white"/>`;
  s+=`<defs><pattern id="${id}" width="1.5" height="1.5" patternUnits="userSpaceOnUse"><path d="M 1.5 0 H 0 V 1.5" fill="none" stroke="#9aa79f" stroke-width="${gridStroke}"/></pattern></defs><rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="url(#${id})"/>`;
  for(const w of m.walls)for(const p of wallPolygons(m,w))s+=`<polygon data-wall="${esc(w.id)}" points="${p.map(p=>p.join(',')).join(' ')}" fill="#27332e"/>`;
  for(const l of m.labels)s+=`<text x="${l.at[0]}" y="${l.at[1]}" font-family="sans-serif" font-size="${l.size??.4}" text-anchor="middle" dominant-baseline="central" fill="#263c30">${esc(l.text)}</text>`;
  return s;
 }
 const papers={a4:{w:297,h:210,tw:21,th:15,name:'A4 landscape'},a3:{w:297,h:420,tw:21,th:30,name:'A3 portrait'}};
 function tiles(b,p,limit=200){
  const result=[],x0=Math.floor(b.x/p.tw),y0=Math.floor(b.y/p.th),x1=Math.ceil((b.x+b.w)/p.tw),y1=Math.ceil((b.y+b.h)/p.th);
  const count=(x1-x0)*(y1-y0);if(count>limit)throw Error(`Region needs ${count} sheets; choose a smaller print region (prototype limit: ${limit}).`);
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)result.push({x:x*p.tw,y:y*p.th,w:p.tw,h:p.th,col:x,row:y});return result;
 }
 function sheet(m,t,p,options){
  const x=(p.w-280)/2,y=(p.h-p.th*1000/75)/2,h=p.th*1000/75;
  const corners=[[x,y],[x+280,y],[x,y+h],[x+280,y+h]];
  const marks=corners.map(([a,b])=>`<path d="M ${a-3} ${b} h 6 M ${a} ${b-3} v 6"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${p.w}mm" height="${p.h}mm" viewBox="0 0 ${p.w} ${p.h}"><rect width="100%" height="100%" fill="white"/><text x="${p.w/2}" y="2.9" text-anchor="middle" font-family="sans-serif" font-size="2">Tile ${t.col}, ${t.row} · x ${t.x}–${t.x+t.w} m · y ${t.y}–${t.y+t.h} m · 1:75</text><svg x="${x}" y="${y}" width="280" height="${h}" viewBox="${t.x} ${t.y} ${t.w} ${t.h}" overflow="hidden">${scene(m,t,{...options,id:`grid-${t.col}-${t.row}`})}</svg><g fill="none" stroke="#35443b" stroke-width=".15">${marks}<path d="M 12 ${p.h-2} h 30 m -30 -1 v 2 m 30 -2 v 2"/></g><text x="44" y="${p.h-1.4}" font-family="sans-serif" font-size="1.8">30 mm / 3 m</text></svg>`;
 }
 function svg(m,b,options){return `<svg xmlns="http://www.w3.org/2000/svg" width="${b.w*1000/75}mm" height="${b.h*1000/75}mm" viewBox="${b.x} ${b.y} ${b.w} ${b.h}">${scene(m,b,options)}</svg>`}
 return {esc,length,validate,bounds,scene,papers,tiles,sheet,svg};
})();

const viewport=document.getElementById('viewport');
let model={wallThickness:.15,walls:[],openings:[],labels:[]},etag='',loaded=false;
let camera={x:10.5,y:7.5,mpp:.04},drag=null;
const settings=new URLSearchParams(location.search);
function view(){return {x:camera.x-viewport.clientWidth*camera.mpp/2,y:camera.y-viewport.clientHeight*camera.mpp/2,w:viewport.clientWidth*camera.mpp,h:viewport.clientHeight*camera.mpp}}
function draw(){
 const b=view();viewport.setAttribute('viewBox',`${b.x} ${b.y} ${b.w} ${b.h}`);
 viewport.innerHTML=Geometry.scene(model,b,{gridStroke:camera.mpp*.8});
}
function fit(){const b=Geometry.bounds(model);camera={x:b.x+b.w/2,y:b.y+b.h/2,mpp:Math.max((b.w+3)/viewport.clientWidth,(b.h+3)/viewport.clientHeight)};draw()}
async function poll(){
 try{
  const response=await fetch('/model',{headers:etag?{'If-None-Match':etag}:{},cache:'no-store'});
  if(response.status!==304){
   if(!response.ok)throw Error(`Model unavailable (${response.status})`);
   const next=Geometry.validate(await response.json()),first=!loaded;
   model=next;etag=response.headers.get('ETag')||'';loaded=true;
   if(first)fit();else draw();
  }
 }catch(error){console.error('Keeping the last valid drawing:',error.message)}
 finally{setTimeout(poll,250)}
}
viewport.addEventListener('pointerdown',event=>{drag={x:event.clientX,y:event.clientY,cx:camera.x,cy:camera.y};viewport.setPointerCapture(event.pointerId)});
viewport.addEventListener('pointermove',event=>{if(!drag)return;camera.x=drag.cx-(event.clientX-drag.x)*camera.mpp;camera.y=drag.cy-(event.clientY-drag.y)*camera.mpp;draw()});
viewport.addEventListener('pointerup',()=>drag=null);viewport.addEventListener('pointercancel',()=>drag=null);
viewport.addEventListener('dblclick',fit);
function zoom(factor,px=viewport.clientWidth/2,py=viewport.clientHeight/2){const old=camera.mpp;camera.mpp=Math.min(100,Math.max(.0001,old*factor));camera.x+=(px-viewport.clientWidth/2)*(old-camera.mpp);camera.y+=(py-viewport.clientHeight/2)*(old-camera.mpp);draw()}
viewport.addEventListener('wheel',event=>{event.preventDefault();const r=viewport.getBoundingClientRect();zoom(Math.exp(Math.max(-200,Math.min(200,event.deltaY))*.002),event.clientX-r.left,event.clientY-r.top)},{passive:false});
function exportSvg(){
 const b=Geometry.bounds(model),padded={x:b.x-.3,y:b.y-.3,w:b.w+.6,h:b.h+.6};
 const url=URL.createObjectURL(new Blob([Geometry.svg(model,padded)],{type:'image/svg+xml'}));
 const a=document.createElement('a');a.href=url;a.download='rpgcad.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
window.addEventListener('keydown',event=>{
 if(event.ctrlKey||event.metaKey||event.altKey)return;
 if(event.key.toLowerCase()==='f')fit();
 if(event.key==='+'||event.key==='=')zoom(.8);
 if(event.key==='-')zoom(1.25);
 if(event.key.toLowerCase()==='s')exportSvg();
});
window.addEventListener('beforeprint',()=>{
 const p=Geometry.papers[settings.get('paper')==='a3'?'a3':'a4'];
 const b=settings.get('region')==='view'?view():Geometry.bounds(model);
 document.getElementById('print-pages').innerHTML='';
 try{
  const ts=Geometry.tiles(b,p);
  document.getElementById('page-style').textContent=`@page{size:${p.w}mm ${p.h}mm;margin:0}.page{width:${p.w}mm;height:${p.h}mm}`;
  document.getElementById('print-pages').innerHTML=ts.map(t=>`<div class="page">${Geometry.sheet(model,t,p)}</div>`).join('');
 }catch(error){console.error(error.message)}
});
new ResizeObserver(()=>draw()).observe(viewport);
fit();poll();
</script>
</html>
