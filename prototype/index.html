<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPGCAD</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }
    #viewport {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #print-pages {
      display: none;
    }
    #gm-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      background: #fff;
      border: 1px solid #75877c;
      padding: 16px;
      font: 15px system-ui;
      box-shadow: 0 2px 10px #0002;
      max-width: 280px;
    }
    #gm-panel[hidden] {
      display: none;
    }
    #gm-panel label {
      display: block;
      margin: 10px 0;
    }
    #gm-panel input {
      width: 70px;
      font: inherit;
    }
    #gm-panel button {
      font: inherit;
      margin: 5px 5px 5px 0;
    }
    #gm-panel p {
      margin: 8px 0;
      font-size: 13px;
    }
    .page {
      margin: 0;
      break-after: page;
      page-break-after: always;
      overflow: hidden;
    }
    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }
    .page svg {
      display: block;
    }
    @media print {
      html,
      body {
        height: auto;
        overflow: visible;
      }
      #viewport,
      #gm-panel {
        display: none;
      }
      #print-pages {
        display: block;
      }
    }
  </style>
  <style id="page-style">
    @page {
      size: A4 landscape;
      margin: 0;
    }
  </style>
  <svg
    id="viewport"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Floor plan on a 1.5 metre square grid"
    role="img"
  ></svg>
  <div id="print-pages"></div>
  <section id="gm-panel" aria-label="GM controls" hidden>
    <strong>Exploration</strong>
    <label
      >Sight range (m)
      <input id="sight-range" type="number" min="0.1" step="0.5" value="6"
    /></label>
    <button id="gm-view" aria-pressed="false">Show full plan (GM)</button>
    <button id="reset-fog">Reset fog · close all doors</button
    ><button id="close-gm">Close</button>
    <p>
      Click the plan to place the POV. Shift-click a door to open or close it.
    </p>
    <p>Shift-G: controls · Shift-R: reset · Shift-F: fog on/off</p>
    <output id="fog-status"></output>
  </section>
  <script type="module" src="/app.js"></script>
</html>
