<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RPGCAD</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: white;
    }
    #viewport {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
      cursor: grab;
    }
    #viewport:active {
      cursor: grabbing;
    }
    #print-pages {
      display: none;
    }
    #edit-palette {
      position: fixed;
      top: 14px;
      left: 14px;
      width: 230px;
      padding: 12px;
      background: #f7fafdf5;
      border: 1px solid #9eafc2;
      border-radius: 5px;
      box-shadow: 0 2px 8px #263d5220;
      font: 13px system-ui;
    }
    #edit-palette[hidden] {
      display: none;
    }
    #edit-palette strong {
      display: block;
      margin-bottom: 9px;
      letter-spacing: 0.08em;
    }
    #edit-palette button {
      font: inherit;
      padding: 5px 9px;
      margin: 0 3px 7px 0;
    }
    #edit-palette button[aria-pressed="true"] {
      background: #d4e6ff;
      border: 1px solid #226ac0;
    }
    #sketch-status {
      display: block;
      margin-top: 5px;
      line-height: 1.4;
    }
    body[data-mode="edit"] #viewport {
      cursor: crosshair;
    }
    body[data-tool="pan"] #viewport {
      cursor: grab;
    }
    #gm-panel {
      position: fixed;
      top: 12px;
      right: 12px;
      background: #fff;
      border: 1px solid #75877c;
      padding: 16px;
      font: 15px system-ui;
      box-shadow: 0 2px 10px #0002;
      max-width: 280px;
      max-height: calc(100vh - 56px);
      overflow-y: auto;
    }
    #gm-panel[hidden] {
      display: none;
    }
    #gm-panel strong {
      display: block;
      margin-top: 10px;
    }
    #gm-panel label {
      display: block;
      margin: 10px 0;
    }
    #gm-panel input {
      width: 70px;
      font: inherit;
    }
    #gm-panel #character-name {
      width: 150px;
    }
    #gm-panel select {
      font: inherit;
      max-width: 230px;
    }
    #gm-panel button {
      font: inherit;
      margin: 5px 5px 5px 0;
    }
    #gm-panel p {
      margin: 8px 0;
      font-size: 13px;
    }
    .page {
      margin: 0;
      break-after: page;
      page-break-after: always;
      overflow: hidden;
    }
    .page:last-child {
      break-after: auto;
      page-break-after: auto;
    }
    .page svg {
      display: block;
    }
    @media print {
      html,
      body {
        height: auto;
        overflow: visible;
      }
      #viewport,
      #gm-panel,
      #edit-palette {
        display: none;
      }
      #print-pages {
        display: block;
      }
    }
  </style>
  <style id="page-style">
    @page {
      size: A4 landscape;
      margin: 0;
    }
  </style>
  <svg
    id="viewport"
    xmlns="http://www.w3.org/2000/svg"
    aria-label="Floor plan on a 1.5 metre square grid"
    role="img"
  ></svg>
  <div id="print-pages"></div>
  <section id="edit-palette" aria-label="Edit tools" hidden>
    <strong>EDIT · SKETCH</strong>
    <button id="pen-tool" aria-pressed="true">Pen</button>
    <button id="pan-tool" aria-pressed="false">Pan</button>
    <button id="undo-stroke">Undo stroke</button>
    <button id="clear-sketch">Clear</button>
    <button id="play-mode">Play</button>
    <a href="/library.html">Library</a>
    <output id="sketch-status" aria-live="polite"></output>
  </section>
  <section id="gm-panel" aria-label="GM controls" hidden>
    <a href="/library.html">Library</a>
    <strong>Characters</strong>
    <label
      >Character
      <select id="character-list" aria-label="Character">
        <option value="">Choose character</option>
      </select></label
    >
    <label
      >Character name <input id="character-name" type="text" maxlength="80"
    /></label>
    <button id="add-pc">Add PC</button><button id="add-npc">Add NPC</button>
    <button id="rename-character">Rename</button
    ><button id="remove-character">Remove character</button>
    <label
      >Destination level
      <select id="character-level" aria-label="Destination level"></select
    ></label>
    <button id="transfer-character">Move to level</button>
    <strong>Exploration</strong>
    <label
      >Sight range (m)
      <input id="sight-range" type="number" min="0.1" step="0.5" value="6"
    /></label>
    <button id="gm-view" aria-pressed="false">Show full plan (GM)</button>
    <button id="reset-fog">Reset fog · close all doors</button
    ><button id="close-gm">Close</button>
    <p>
      Add a character at the view centre, then drag it into place. Click a PC to
      use its POV. Shift-click a door to open or close it.
    </p>
    <p>Shift-G: controls · Shift-R: reset · Shift-F: fog on/off</p>
    <output id="fog-status"></output>
  </section>
  <script type="module" src="/app.js"></script>
</html>
