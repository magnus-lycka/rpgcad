<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>RPGCAD · Plan library</title>
  <style>
    body {
      margin: 2rem;
      background: #f1f5fa;
      color: #27332e;
      font-family: system-ui, sans-serif;
    }
    #cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }
    article {
      background: white;
      padding: 1rem;
      border: 1px solid #ccd4da;
      border-radius: 0.4rem;
    }
    svg[data-thumbnail] {
      width: 100%;
      height: 180px;
      background: white;
    }
    button,
    a {
      cursor: pointer;
    }
    a {
      margin-right: 1rem;
    }
    h2 {
      font-size: 1.1rem;
    }
    button {
      font: inherit;
    }
  </style>
  <h1>Plan library</h1>
  <nav id="library-navigation"></nav>
  <p id="library-status" role="status"></p>
  <section id="cards" aria-label="Plans"></section>
  <script type="module" src="/library.js"></script>
</html>
